[project]
name = "pehradar-api"
version = "0.1.0"
description = "PehRadar API — fire/smoke decision-support backend (Karachi MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3,<0.144",
    "onnxruntime>=1.30.0,<1.31",
    "opencv-python-headless>=4.14.0.94,<4.15",
    "pydantic-settings>=2.16.0,<3",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
